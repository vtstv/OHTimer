<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="reticleGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Frame -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" 
           stroke="url(#cyanPurple)" stroke-width="2.5" fill="#0B0F17" stroke-linejoin="round" />
  
  <!-- Outer Radial Ticks -->
  <line x1="32" y1="8" x2="32" y2="13" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="51" x2="32" y2="56" stroke="#A855F7" stroke-width="2" stroke-linecap="round" />
  <line x1="12" y1="32" x2="17" y2="32" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" />
  <line x1="47" y1="32" x2="52" y2="32" stroke="#A855F7" stroke-width="2" stroke-linecap="round" />

  <!-- Inner Radar / Timer Ring -->
  <circle cx="32" cy="32" r="18" stroke="#1F293D" stroke-width="2" />
  <path d="M 32 14 A 18 18 0 0 1 50 32" stroke="url(#reticleGlow)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

  <!-- Center Stardust Inversion Diamond -->
  <polygon points="32,20 40,32 32,44 24,32" fill="url(#cyanPurple)" />
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" />

  <!-- Dynamic Corner Accent Nodes -->
  <circle cx="32" cy="4" r="2" fill="#00F0FF" />
  <circle cx="56" cy="18" r="2" fill="#00F0FF" />
  <circle cx="56" cy="46" r="2" fill="#A855F7" />
  <circle cx="32" cy="60" r="2" fill="#A855F7" />
  <circle cx="8" cy="46" r="2" fill="#A855F7" />
  <circle cx="8" cy="18" r="2" fill="#00F0FF" />
</svg>

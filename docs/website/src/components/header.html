<header class="site-header">
  <div class="container nav-container">
    <a href="#" class="brand-link" aria-label="Once Human: Event Timer Home">
      <img src="assets/images/app-logo.svg" alt="Once Human Event Timer Logo" class="brand-logo-icon">
      <span class="brand-name">Once Human: Event Timer</span>
    </a>

    <nav aria-label="Main Navigation">
      <ul class="nav-links" id="nav-links">
        <li><a href="#features" class="nav-link" data-i18n="nav.features">Features</a></li>
        <li><a href="#screenshots" class="nav-link" data-i18n="nav.screenshots">Screenshots</a></li>
        <li><a href="#download" class="nav-link" data-i18n="nav.download">Download</a></li>
        <li><a href="#faq" class="nav-link" data-i18n="nav.faq">FAQ</a></li>
        <li class="mobile-menu-divider" aria-hidden="true"></li>
        <li class="mobile-menu-controls">
          <!-- Mobile Language Switch -->
          <div class="mobile-lang-switch">
            <div class="mobile-control-header">
              <svg class="icon-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
              <span data-i18n="nav.language">Language</span>
            </div>
            <div class="mobile-lang-options" role="group" aria-label="Language selection">
              <button type="button" class="mobile-lang-btn active" data-lang="en">English</button>
              <button type="button" class="mobile-lang-btn" data-lang="de">Deutsch</button>
              <button type="button" class="mobile-lang-btn" data-lang="ru">Русский</button>
            </div>
          </div>

          <!-- Mobile Theme Toggle -->
          <div class="mobile-theme-switch">
            <button type="button" class="mobile-theme-btn" id="mobile-theme-toggle-btn" aria-label="Switch to light theme" title="Toggle Theme">
              <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
              <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
              <span class="mobile-theme-label" data-i18n="nav.theme">Theme</span>
            </button>
          </div>
        </li>
      </ul>
    </nav>

    <div class="nav-actions">
      <!-- Language Selector Dropdown -->
      <div class="lang-selector" id="lang-selector">
        <button type="button" class="lang-btn" id="lang-btn" aria-haspopup="true" aria-expanded="false" aria-label="Select language" title="Select Language">
          <svg class="icon-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-current" id="lang-current">English</span>
          <svg class="icon-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="lang-dropdown" id="lang-dropdown" role="menu">
          <button type="button" class="lang-option active" data-lang="en" role="menuitem">English</button>
          <button type="button" class="lang-option" data-lang="de" role="menuitem">Deutsch</button>
          <button type="button" class="lang-option" data-lang="ru" role="menuitem">Русский</button>
        </div>
      </div>

      <!-- Theme Toggle Button -->
      <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Switch to light theme" title="Toggle Theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>

      <!-- GitHub Link Button -->
      <a href="https://github.com/vtstv/OHTimer" target="_blank" rel="noopener noreferrer" class="github-btn" aria-label="GitHub Repository" title="GitHub Repository">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
      </a>

      <!-- Download CTA -->
      <a href="#download" class="btn btn-primary btn-sm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span data-i18n="header.download">Download</span>
      </a>

      <!-- Mobile Toggle Button -->
      <button type="button" class="nav-mobile-toggle" id="nav-mobile-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
</header>
